# A test build of this branch for a fork, started by hand: Actions > Touch controls test build > Run workflow.
# For trying the touch controls (shims/appkit/sptouchoverlay.m) on a device with no Mac: it builds the device
# kit unsigned on macOS (as release.sh does, without Developer ID or notarization: the host tool signs it with
# the player's Apple ID), slashplayed-companion against it (companion-rs-build.yml, which points the tool at
# this repository's release for the kit, SP_KIT_REPO), and publishes both as a prerelease of this repository,
# tagged touch-<version>-test.<run number>, which never matches release.yml's v*. No secrets, no environment:
# nothing here signs or notarizes anything. The Windows .exe is unsigned, so SmartScreen warns about it.
name: Touch controls test build

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: touch-test-build
  cancel-in-progress: false

env:
  # The companion-deps action's pins and cache paths, as in ci.yml (see the comments there).
  XCODE_APP: /Applications/Xcode_27.1.app
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  RUSTUP_VERSION: 1.29.2
  RUSTUP_SHA256: f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
  IDEVICE_CACHE_PATHS: |
    work/idevice/BUILD.txt
    work/idevice/include
    work/idevice/ios
    work/idevice/xros
    work/idevice/macos
  SPAPPLE_CACHE_PATHS: |
    work/spapple/BUILD.txt
    work/spapple/ios
    work/spapple/xros

jobs:
  kit:
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      kit_sha256: ${{ steps.kit.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the test build
        id: meta
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^ *MARKETING_VERSION:/ {print $2; exit}' apps/companion/project.yml)"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "tag=touch-$version-test.$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/companion-deps

      - name: Fetch the start screen's font
        run: scripts/fetch-font.sh

      # The device builds bundle-resources.sh stages (shims, launcher, JIT helper, icon), assembled into the
      # kit. This runner has no game install, so there's nothing Blizzard's for them to have come from.
      - name: Build the device kit
        run: |
          set -euo pipefail
          sh apps/companion/bundle-resources.sh --build "$RUNNER_TEMP/stage"
          scripts/release/device-kit.sh "$RUNNER_TEMP/stage" "$RUNNER_TEMP/kit/slashplayed-device-kit.zip"

      - name: Note the kit's hash
        id: kit
        run: echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/kit/slashplayed-device-kit.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-kit
          path: ${{ runner.temp }}/kit/slashplayed-device-kit.zip
          if-no-files-found: error
          retention-days: 7

  companion-rs-build:
    needs: kit
    permissions:
      contents: read
    uses: ./.github/workflows/companion-rs-build.yml
    with:
      kit_sha256: ${{ needs.kit.outputs.kit_sha256 }}
      release_tag: ${{ needs.kit.outputs.tag }}

  publish:
    needs: [kit, companion-rs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the tag and the prerelease
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.kit.outputs.tag }}
          SHA: ${{ needs.kit.outputs.sha }}
          VERSION: ${{ needs.kit.outputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd assets && sha256sum -- *) > SHA256SUMS
          cat SHA256SUMS
          cat > notes.md <<EOF
          A test build of the touch controls, built from \`$REF\` ($SHA): Slashplayed $VERSION with a thumbstick,
          camera drag, taps, and Jump, Target, Menu, and Keyboard buttons on iPhone and iPad.

          - **Windows:** download \`slashplayed-companion-windows-x86_64.zip\`, unzip it, and run
            Slashplayed Companion.exe. It's unsigned, so SmartScreen warns about it (More info > Run anyway). It
            downloads this release's device kit itself. It needs Apple's device driver: Apple Devices from the
            Microsoft Store, or iTunes.
          - Unofficial and experimental: not a Slashplayed release.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
            --title "Touch controls test build ${TAG##*.} (Slashplayed $VERSION)" --notes-file notes.md \
            assets/* SHA256SUMS
